name: Create Milestone

on: 
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

jobs:
  preflight:
    name: Verify milestone Azure prerequisites
    runs-on: ubuntu-latest
    outputs:
      milestone_ready: ${{ steps.verify.outputs.milestone_ready }}
    env:
      DEVOPS_CLIENT_ID: ${{ secrets.DEVOPS_CLIENT_ID }}
      DEVOPS_TENANT_ID: ${{ secrets.DEVOPS_TENANT_ID }}
      DEVOPS_SUB_ID: ${{ secrets.DEVOPS_SUB_ID }}
    steps:
      - id: verify
        shell: bash
        run: |
          set -euo pipefail
          required=(DEVOPS_CLIENT_ID DEVOPS_TENANT_ID DEVOPS_SUB_ID)
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo 'milestone_ready=true' >> "$GITHUB_OUTPUT"
            echo 'Milestone prerequisites are available.'
          else
            echo 'milestone_ready=false' >> "$GITHUB_OUTPUT"
            echo "Milestone workflow skipped because required Azure settings are unavailable: ${missing[*]}"
          fi

  main:
    needs: preflight
    if: ${{ needs.preflight.outputs.milestone_ready == 'true' }}
    runs-on: ubuntu-latest
    environment: engineering
    permissions:
      issues: write
      id-token: write
      contents: read
    steps:
      - name: 'Az CLI login'
        uses: azure/login@v1
        with:
          client-id: ${{secrets.DEVOPS_CLIENT_ID}}
          tenant-id: ${{secrets.DEVOPS_TENANT_ID}}
          subscription-id: ${{secrets.DEVOPS_SUB_ID}}

      - name: Checkout
        uses: actions/checkout@v3
      - name: Checkout github action repository
        uses: actions/checkout@v3
        with:
         repository: "microsoft/vscode-github-triage-actions"
         ref: stable 
         path: ./action-base

      - name: Copy action
        run: cp -r .github/actions/create-milestone ./action-base/create-milestone

      - name: Npm install dependencies
        run: npm install azure-devops-node-api --prefix ./action-base
      - name: Npm install
        run: npm install --production --prefix ./action-base
      - name: Build action
        continue-on-error: true
        run: npm run build --prefix ./action-base

      - name: Run Create Milestone
        uses: ./action-base/create-milestone
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          devops-org: "msazure"
          devops-projectId: "Microsoft Teams Extensibility"