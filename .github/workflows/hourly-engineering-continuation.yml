name: Hourly Engineering Continuation

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-engineering-continuation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  continuation:
    name: Load state, audit, and save continuation record
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load previous continuation state
        id: load-state
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/variables/M365_HOURLY_STATE" --jq '.value' 2>/dev/null || true)"
          if [ "$state" = "null" ]; then
            state=""
          fi
          state_source="repository_variable"
          if [ -z "$state" ]; then
            artifact_meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --paginate --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("hourly-engineering-continuation-")) | [.workflow_run.id,.name,.created_at] | @tsv' 2>/dev/null | sort -k3,3r | head -1 || true)"
            artifact_run_id="$(cut -f1 <<<"$artifact_meta")"
            artifact_name="$(cut -f2 <<<"$artifact_meta")"
            if [ -n "$artifact_run_id" ] && [ -n "$artifact_name" ]; then
              rm -rf "$RUNNER_TEMP/hourly-previous-state"
              mkdir -p "$RUNNER_TEMP/hourly-previous-state"
              if gh run download "$artifact_run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$RUNNER_TEMP/hourly-previous-state" >/dev/null 2>&1; then
                artifact_state="$(find "$RUNNER_TEMP/hourly-previous-state" -type f -name 'hourly-continuation-state.json' -print -quit)"
                if [ -n "$artifact_state" ] && jq -e . "$artifact_state" >/dev/null 2>&1; then
                  state="$(cat "$artifact_state")"
                  state_source="artifact"
                fi
              fi
            fi
          fi
          {
            echo 'M365_HOURLY_STATE<<M365_HOURLY_STATE_EOF'
            printf '%s\n' "$state"
            echo 'M365_HOURLY_STATE_EOF'
          } >> "$GITHUB_ENV"
          echo "M365_STATE_SOURCE=$state_source" >> "$GITHUB_ENV"
          echo "state_source=$state_source" >> "$GITHUB_OUTPUT"
          if [ -n "$state" ]; then
            echo "state_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "state_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute bounded continuation audit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PERSIST_STATE: "1"
        run: bash scripts/maintenance/hourly-continuation.sh continuation-report

      - name: Upload continuation record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hourly-engineering-continuation-${{ github.run_id }}
          path: continuation-report/
          if-no-files-found: error
          retention-days: 90
