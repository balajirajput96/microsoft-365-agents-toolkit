name: Hourly Engineering Continuation

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-engineering-continuation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  continuation:
    name: Load state, audit, and save continuation record
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load previous continuation state
        id: load-state
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          state=""
          state_source="empty"
          variable_error="$RUNNER_TEMP/hourly-state-variable-error.log"
          if variable_value="$(GH_FORCE_TTY=0 NO_COLOR=1 CLICOLOR=0 GH_PAGER=cat gh api "repos/$GITHUB_REPOSITORY/actions/variables/M365_HOURLY_STATE" --jq '.value // empty' 2>"$variable_error")"; then
            if [ -n "$variable_value" ]; then
              state="$variable_value"
              state_source="repository_variable"
            fi
          else
            variable_exit=$?
            variable_bytes="$(wc -c < "$variable_error" | tr -d ' ')"
            echo "::warning::Continuation state variable lookup failed (exit=$variable_exit, stderr_bytes=$variable_bytes); trying artifact recovery."
          fi
          if [ -z "$state" ]; then
            artifact_error="$RUNNER_TEMP/hourly-state-artifact-error.log"
            if artifact_meta="$(GH_FORCE_TTY=0 NO_COLOR=1 CLICOLOR=0 GH_PAGER=cat gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("hourly-engineering-continuation-")) | [.workflow_run.id,.name,.created_at] | @tsv' 2>"$artifact_error")"; then
              artifact_meta="$(sort -k3,3r <<<"$artifact_meta" | head -1)"
            else
              artifact_exit=$?
              artifact_bytes="$(wc -c < "$artifact_error" | tr -d ' ')"
              echo "::warning::Continuation artifact listing failed (exit=$artifact_exit, stderr_bytes=$artifact_bytes); starting with empty state."
              artifact_meta=""
            fi
            artifact_run_id="$(cut -f1 <<<"$artifact_meta")"
            artifact_name="$(cut -f2 <<<"$artifact_meta")"
            if [ -n "$artifact_run_id" ] && [ -n "$artifact_name" ]; then
              rm -rf "$RUNNER_TEMP/hourly-previous-state"
              mkdir -p "$RUNNER_TEMP/hourly-previous-state"
              download_error="$RUNNER_TEMP/hourly-state-download-error.log"
              if GH_FORCE_TTY=0 NO_COLOR=1 CLICOLOR=0 GH_PAGER=cat gh run download "$artifact_run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$RUNNER_TEMP/hourly-previous-state" >"$download_error" 2>&1; then
                artifact_state="$(find "$RUNNER_TEMP/hourly-previous-state" -type f -name 'hourly-continuation-state.json' -print -quit)"
                if [ -n "$artifact_state" ] && jq -e . "$artifact_state" >/dev/null 2>&1; then
                  state="$(cat "$artifact_state")"
                  state_source="artifact"
                else
                  echo "::warning::Continuation artifact downloaded but did not contain a valid state JSON."
                fi
              else
                download_exit=$?
                download_bytes="$(wc -c < "$download_error" | tr -d ' ')"
                echo "::warning::Continuation artifact download failed (exit=$download_exit, stderr_bytes=$download_bytes)."
              fi
            else
              echo "::notice::No recoverable continuation artifact was found; starting with empty state."
            fi
          fi
          {
            echo 'M365_HOURLY_STATE<<M365_HOURLY_STATE_EOF'
            printf '%s\n' "$state"
            echo 'M365_HOURLY_STATE_EOF'
          } >> "$GITHUB_ENV"
          echo "M365_STATE_SOURCE=$state_source" >> "$GITHUB_ENV"
          echo "state_source=$state_source" >> "$GITHUB_OUTPUT"
          if [ -n "$state" ]; then
            echo "state_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "state_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute bounded continuation audit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PERSIST_STATE: "1"
        run: bash scripts/maintenance/hourly-continuation.sh continuation-report

      - name: Upload continuation record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hourly-engineering-continuation-${{ github.run_id }}
          path: continuation-report/
          if-no-files-found: error
          retention-days: 90
